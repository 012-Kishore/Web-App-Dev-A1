
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IPL 2026 Ticket Booking Form">
    <title>IPL 2026 | Book Tickets</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="site-header">
        <a class="brand" href="index.html">IPL <span>2026</span></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#matches">Matches</a>
            <a href="booking.html">Book Ticket</a>
        </nav>
    </header>

    <main>
        <section class="section booking-section">
            <div class="section-heading">
                <p class="eyebrow">YOUR MATCH DAY STARTS HERE</p>
                <h2>IPL Ticket Booking Form</h2>
                <p>Enter your details to book your match tickets.</p>
            </div>

            <form class="booking-form" action="#" method="get">

                <label for="name">Name:</label>
                <input type="text" id="name" name="name"
                       minlength="3" maxlength="30" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone"
                       pattern="[0-9]{10}" maxlength="10"
                       placeholder="10-digit phone number" required>

                <label for="match">Match Selection:</label>
                <select id="match" name="match" required>
                    <option value="">Select a match</option>
                    <option value="CSK vs MI">CSK vs MI</option>
                    <option value="RCB vs KKR">RCB vs KKR</option>
                    <option value="SRH vs RR">SRH vs RR</option>
                    <option value="MI vs KKR">MI vs KKR</option>
                    <option value="CSK vs RCB">CSK vs RCB</option>
                    <option value="RR vs SRH">RR vs SRH</option>
                </select>

                <label for="stand">Stand Category:</label>
                <select id="stand" name="stand" required>
                    <option value="">Select a stand</option>
                    <option value="General">General</option>
                    <option value="Premium">Premium</option>
                    <option value="VIP">VIP</option>
                </select>

                <label for="quantity">Number of Tickets:</label>
                <input type="number" id="quantity" name="quantity"
                       min="1" max="10" required>

                <label>Booking Preference:</label>
                <div>
                    <input type="radio" id="regular" name="preference"
                           value="Regular" required>
                    <label for="regular">Regular Booking</label>

                    <input type="radio" id="early" name="preference"
                           value="Early">
                    <label for="early">Early Booking</label>
                </div>

                <button class="button button-primary submit-button"
                
                        type="submit">Submit Booking</button>

                <button class="button submit-button"
                        type="reset">Reset Form</button>

            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 IPL Ticket Booking. All rights reserved.</p>
    </footer>

    <script src="app.js" defer></script>

</body>
</html>
